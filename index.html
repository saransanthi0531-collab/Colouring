<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .header {
            height: 65px;
            background: #3f51b5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 5px #999;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .menu {
            font-size: 30px;
        }

        .main {
            text-align: center;
            padding-top: 120px;
        }

        .thinking {
            font-size: 22px;
            margin-bottom: 100px;
        }

        .guess-title {
            font-size: 22px;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 15px;
        }

        #guessBox {
            width: 280px;
            height: 50px;
            border: none;
            border-bottom: 2px solid #777;
            outline: none;
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 28px;
            font-size: 20px;
            border: none;
            border-radius: 4px;
            margin: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px #aaa;
        }

        #guessButton {
            background: #ddd;
            color: black;
        }

        #restartButton {
            background: red;
            color: white;
        }

        #result {
            margin-top: 30px;
            font-size: 21px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Number Guessing Game</h1>
        <div class="menu">⋮</div>
    </div>

    <div class="main">

        <div class="thinking">
            Thinking the number between 1 and 30...
        </div>

        <div class="guess-title">
            Guess the Number.
        </div>

        <input type="number" id="guessBox">

        <br>

        <button id="guessButton" onclick="checkGuess()">
            Guess
        </button>

        <button id="restartButton" onclick="restartGame()">
            Restart
        </button>

        <div id="result"></div>

    </div>

    <script>
        var randomNumber = Math.floor(Math.random() * 30) + 1;

        function checkGuess() {

            var guess = document.getElementById("guessBox").value;
            var result = document.getElementById("result");

            if (guess === "") {
                result.innerHTML = "Please enter a number.";
                result.style.color = "red";
                return;
            }

            guess = Number(guess);

            if (guess < 1 || guess > 30) {
                result.innerHTML = "Enter a number between 1 and 30.";
                result.style.color = "red";
                return;
            }

            if (guess == randomNumber) {

                result.innerHTML =
                    "Correct! My Number was " + randomNumber;

                result.style.color = "green";

            } else if (guess < randomNumber) {

                result.innerHTML =
                    "Wrong!..... My Number is higher.....";

                result.style.color = "red";

            } else {

                result.innerHTML =
                    "Wrong!..... My Number is lower.....";

                result.style.color = "red";
            }
        }

        function restartGame() {

            randomNumber = Math.floor(Math.random() * 30) + 1;

            document.getElementById("guessBox").value = "";

            document.getElementById("result").innerHTML = "";
        }
    </script>

</body>
</html>
